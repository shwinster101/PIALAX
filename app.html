<style>

  --p0: #2563EB; --p1: #7C3AED; --p2: #DB2777; --p3: #0891B2; --p4: #4338CA; --p5: #A21CAF; --p6: #8B5A2B; --p7: #1E3A8A;
  --sk-day: #BFE2F4; --sk-dusk: #F2CBA8; --sk-eve: #2D3A63; --sun: #F5C344; --grass: #A3CD7E; --roof: #B4483A; --wall: #F3E5CF; --win: #FFE8A3; --door: #7A4B2E;
  --sea: #3A8DC1; --foam: #E7F4FB; --sand: #EED9A8; --mtn: #6F809A; --mtn2: #8D9BB2; --snow: #FFFFFF; --bldg: #4F5D75; --bldg2: #6D7A93; --lit: #FFE8A3;
  --frame: #D8DDE5; --cloud: #FFFFFF; --wire: #3A3A3A; --b1: #F5C344; --b2: #E2574C; --b3: #4CB7A5; --b4: #8F7CEC; --table: #C98B5B;
  --shade: rgba(16, 20, 28, .18); --land: #E6E9EE; --border-land: #C8CED8;
  --chip: transparent; --tkdim: .45;

}

    --bg: #0E1014; --surface: #171A20; --sunk: #21252D; --ink: #ECEEF2; --ink2: #A8AFBB; --ink3: #8B93A0; --line: #2C313A; --backdrop: #07080A;
    --on-ink: #0E1014; --scrim: rgba(0, 0, 0, .6); --focus: #60A5FA; --hatch: rgba(236, 238, 242, .08); --weekend: rgba(236, 238, 242, .10);
    --in: #22C55E; --maybe: #F59E0B; --mute: #9CA3AF; --bad: #F87171; --on-status: #0E1014;
    --p0: #60A5FA; --p1: #A78BFA; --p2: #F472B6; --p3: #22D3EE; --p4: #818CF8; --p5: #E879F9; --p6: #C08457; --p7: #93C5FD;
    --sk-day: #2F5274; --sk-dusk: #5B3F55; --sk-eve: #141A31; --sun: #E7C36A; --grass: #3D6A3A; --roof: #8B3A30; --wall: #CBB89D; --win: #E7C36A; --door: #5A3720;
    --sea: #23597F; --foam: #9DBBD0; --sand: #A68F69; --mtn: #4A5970; --mtn2: #5E6D86; --snow: #D7DDE7; --bldg: #2D394C; --bldg2: #3D4A60; --lit: #E7C36A;
    --frame: #3A414F; --cloud: #C7D0DC; --wire: #C8C8C8; --b1: #E7C36A; --b2: #E06A60; --b3: #4FB3A3; --b4: #9D8CEB; --table: #8E6343;
    --shade: rgba(0, 0, 0, .55); --land: #1C2028; --border-land: #343A45;

    --markbg: #D9DEE7; --markink: #15181D;

  }
}
:root[data-theme="dark"] {
  --bg: #0E1014; --surface: #171A20; --sunk: #21252D; --ink: #ECEEF2; --ink2: #A8AFBB; --ink3: #8B93A0; --line: #2C313A; --backdrop: #07080A;
  --on-ink: #0E1014; --scrim: rgba(0, 0, 0, .6); --focus: #60A5FA; --hatch: rgba(236, 238, 242, .08); --weekend: rgba(236, 238, 242, .10);
  --in: #22C55E; --maybe: #F59E0B; --mute: #9CA3AF; --bad: #F87171; --on-status: #0E1014;
  --p0: #60A5FA; --p1: #A78BFA; --p2: #F472B6; --p3: #22D3EE; --p4: #818CF8; --p5: #E879F9; --p6: #C08457; --p7: #93C5FD;
  --sk-day: #2F5274; --sk-dusk: #5B3F55; --sk-eve: #141A31; --sun: #E7C36A; --grass: #3D6A3A; --roof: #8B3A30; --wall: #CBB89D; --win: #E7C36A; --door: #5A3720;
  --sea: #23597F; --foam: #9DBBD0; --sand: #A68F69; --mtn: #4A5970; --mtn2: #5E6D86; --snow: #D7DDE7; --bldg: #2D394C; --bldg2: #3D4A60; --lit: #E7C36A;
  --frame: #3A414F; --cloud: #C7D0DC; --wire: #C8C8C8; --b1: #E7C36A; --b2: #E06A60; --b3: #4FB3A3; --b4: #9D8CEB; --table: #8E6343;
  --shade: rgba(0, 0, 0, .55); --land: #1C2028; --border-land: #343A45;
  --chip: #3A414D; --tkdim: .8;
  --markbg: #D9DEE7; --markink: #15181D;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.35 var(--font); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }
.num, .tn { font-variant-numeric: tabular-nums; font-weight: 600; }
.sp { flex: 1 1 auto; }
.facebtn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border-radius: 50%; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app column ---------- */
.app { min-height: 100%; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.app.fabpad { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 12px; }
.screen > * { min-width: 0; }
.toprow { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); min-height: 56px; display: flex; align-items: center; gap: 4px; margin: 0 -4px; }
.ib { min-width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; font-size: 21px; position: relative; flex: none; }
.ib:hover { background: var(--sunk); }
.ib .badge { position: absolute; top: -4px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pulse { animation: pulse 1.6s ease-in-out 3; } /* every pulse stops after 3 cycles */
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 18%, transparent); } }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; min-height: 50px; }
.seg button { border-radius: 9px; font-weight: 600; font-size: 16px; color: var(--ink2); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shade); }

/* ---------- avatars (faces) with status rings ---------- */
.av { --s: 44px; position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--pc); flex: none; }
.av > .f { font-size: calc(var(--s) * .56); line-height: 1; }
.av.s28 { --s: 28px; } .av.s36 { --s: 36px; } .av.s40 { --s: 40px; } .av.s48 { --s: 48px; } .av.s64 { --s: 64px; } .av.s72 { --s: 72px; }
.st-in { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--in); }
.st-hostdef { outline: 2px dotted var(--in); outline-offset: 2px; }
.st-maybe { outline: 3px dashed var(--maybe); outline-offset: 2px; }
.st-wait { outline: 2px dotted var(--mute); outline-offset: 2px; }
.st-out { background: color-mix(in srgb, var(--pc) 35%, transparent); }
.st-out > .f { opacity: .4; }
.av.s28.st-in { box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3.5px var(--in); }
.av.s28.st-maybe { outline-width: 2px; outline-offset: 1px; }
.av.s28.st-wait, .av.s28.st-hostdef { outline-offset: 1px; }
.av .mk { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--on-status); box-shadow: 0 0 0 2px var(--surface); }
.av .mk svg { width: 12px; height: 12px; }
.mk.k-in { background: var(--in); } .mk.k-maybe { background: var(--maybe); } .mk.k-out { background: var(--mute); }
.mk.k-hostdef { background: var(--surface); color: var(--in); box-shadow: 0 0 0 2px var(--in); }
.av .bd { position: absolute; top: -6px; right: -7px; font-size: 13px; line-height: 1; background: var(--markbg); color: var(--markink); border-radius: 9px; padding: 2px; box-shadow: 0 0 0 1px var(--line); }
.av .bd2 { top: auto; right: auto; bottom: -6px; left: -7px; }
.av .cnt { position: absolute; top: -6px; left: -8px; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--ink); border-radius: 8px; padding: 0 4px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.av .new { position: absolute; bottom: -2px; left: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); animation: pulse 1.6s 3; }
.faces { display: flex; align-items: center; }
.faces .av + .av { margin-left: -6px; }
.more { font-size: 14px; color: var(--ink2); margin-left: 4px; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- trip cards ---------- */
.card { position: relative; background: var(--surface); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; border: 1px solid var(--line); }
.card > * { min-width: 0; }
.card.dim { background: var(--sunk); } .card.dim .pc { opacity: .55; }
.card.fly { animation: fly .6s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes fly { from { transform: translateY(-40px); opacity: 0; } to { transform: none; opacity: 1; } } /* PIA-138: no scale, so a card's targets (its date pill) stay ≥44px as it flies in */
.card-a { display: flex; gap: 12px; align-items: flex-start; min-height: 60px; }
.card-t { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: 2px; }
.card-open { text-align: left; font-weight: inherit; }
.card-open::after { content: ""; position: absolute; inset: 0; border-radius: 18px; }
.card-open:focus-visible { outline: none; }
.card-open:focus-visible::after { outline: 3px solid var(--focus); outline-offset: 2px; }
.card .z { position: relative; z-index: 1; }
.card-b, .card-c { display: flex; align-items: center; gap: 6px; min-height: 40px; }
.card-c { pointer-events: none; } /* faces, heads and the stage disc are information: a tap there opens the trip */
.card-b { flex-wrap: wrap; }
.slot { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 19px; border: 1.5px solid var(--ink); flex: none; position: relative; font-weight: 700; white-space: nowrap; }
.slot.gf { background: var(--surface); color: var(--ink); font-size: 17px; } /* Keep ✈↗ inside the bordered 48px target with wider emoji fonts. */
.slot.off { border-color: var(--mute); color: var(--mute); }
.slot.wide { width: auto; min-width: 48px; padding: 0 8px; font-size: 17px; }
.slot.plain { border-color: transparent; }
.slot .corner { position: absolute; top: -6px; right: -6px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 3px; min-height: 44px; padding: 0 9px; border-radius: 22px; border: 1.5px dashed var(--ink3); font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; position: relative; }
.pill.set { border-style: solid; border-color: var(--ink); }
.pill .w { color: var(--bad); }
.pill .g, .tot .g { font-size: .82em; margin-right: 1px; }
.pill > span[data-k] { white-space: nowrap; }
.pill .dr { position: relative; display: inline-block; }
.pill .myu { position: absolute; bottom: -5px; height: 3px; border-radius: 2px; background: var(--pc); } /* my own days under the plan */
.pill .tg { position: relative; display: inline-block; } /* ⏳ days to go, the book-by arc under it */
.bba { position: absolute; left: 1px; right: 1px; bottom: -5px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bba > i { display: block; height: 100%; border-radius: 2px; background: var(--ink2); }
.gl .bba { position: relative; display: inline-block; left: auto; right: auto; bottom: auto; width: 30px; vertical-align: middle; }
.gl .loc { display: inline-block; width: 30px; height: 20px; } .gl .loc svg { width: 100%; height: 100%; }
.tot { min-width: 44px; justify-content: flex-end; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; border-radius: 12px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }
.tot.stale { color: var(--mute); }
.tot.part { color: var(--ink2); border: 1.5px solid var(--ink3); padding: 0 8px; } /* a partial total is outlined */
.tot .uf, .totalblk .uf, .sum .uf { font-size: .8em; letter-spacing: -.02em; }
.heads { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink2); }
.pips { display: inline-flex; align-items: center; gap: 4px; position: relative; padding: 0 2px; margin-left: auto; }
.pips::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 1.5px; background: var(--line); }
.pip { position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; line-height: 1; border: 1.5px solid var(--line); background: var(--surface); }
.pip > span { opacity: .45; }
.pip.past { border: 1.5px solid var(--sunk); background: var(--sunk); } .pip.past > span { opacity: 1; }
.pip.now { width: 30px; height: 30px; font-size: 15px; border: 2px solid var(--ink); background: var(--sunk); } .pip.now > span { opacity: 1; }
.pips.lg .pip { width: 26px; height: 26px; font-size: 13px; } .pips.lg .pip.now { width: 34px; height: 34px; font-size: 17px; }
.pips.one::before { display: none; }
.pips.one .pip.now { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
.pips.one.lg .pip.now { width: 34px; height: 34px; font-size: 18px; }
.shelfrow { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-size: 17px; font-weight: 600; color: var(--ink2); border: 1.5px solid var(--line); width: 100%; font-variant-numeric: tabular-nums; }
.shelfrow .chev { transition: transform .2s; margin-left: auto; width: 10px; height: 10px; margin-right: 4px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-3px) rotate(45deg); } /* a drawn shape: ⌄ only ever closes a sheet */
.shelfrow[aria-expanded="true"] .chev { transform: translateY(3px) rotate(225deg); }

/* postcards */
.pc { position: relative; flex: none; width: 72px; height: 54px; border-radius: 6px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
.pc > svg.scene { width: 100%; height: 100%; }
.pc .loc { position: absolute; right: 2px; bottom: 2px; width: 26px; height: 17px; border-radius: 3px; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px; }
.pc .loc svg { width: 100%; height: 100%; }
.pc .lk { position: absolute; left: 2px; top: 2px; font-size: 11px; line-height: 1; background: var(--surface); border-radius: 4px; padding: 1px; }
.pc.lg { width: 100%; height: 120px; border-radius: 16px; box-shadow: none; }
.pc.md { width: 96px; height: 54px; }

/* ---------- FAB and tab bar ---------- */
.fab { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-size: 28px; display: grid; place-items: center; box-shadow: 0 6px 18px var(--shade); }
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar button { min-height: 64px; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--ink2); position: relative; }
.tabbar button .g { font-size: 22px; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.tabbar .badge { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--on-ink); font-size: 12px; display: grid; place-items: center; padding: 0 4px; font-variant-numeric: tabular-nums; }

/* ---------- empty / ghost ---------- */
.ghost { border: 2px solid var(--line); border-radius: 18px; padding: 20px 16px; display: grid; justify-items: center; gap: 14px; }
.ghost svg { width: 220px; max-width: 100%; height: auto; }
.bigplus { width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-size: 28px; display: grid; place-items: center; }
.bigplus.wide { width: auto; display: inline-flex; gap: 8px; padding: 0 22px; font-size: 18px; font-weight: 700; } .bigplus.wide > span { font-size: 26px; }

/* ---------- family board ---------- */
.board { display: grid; gap: 0; align-items: center; }
.board .hd { display: grid; justify-items: center; gap: 2px; min-height: 64px; align-content: center; border-radius: 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.board .hd .sc { font-size: 20px; width: 34px; height: 26px; border-radius: 5px; display: grid; place-items: center; background: var(--sunk); }
.board .rowh { display: grid; justify-items: center; align-content: center; min-height: 64px; position: relative; }
.board .rowh .facebtn { position: relative; }
.board .rowh .fn { font-size: 14px; }
.board .rowh .hn { position: absolute; right: -14px; top: -4px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 0 2px; line-height: 1.2; }
.board .rowh.focus .av { box-shadow: 0 0 0 3px var(--ink); }
.cell { min-height: 64px; display: grid; justify-items: center; align-content: center; gap: 4px; position: relative; border-radius: 10px; }
.cell .own { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink2); line-height: 1; }
.cell .cwrap { position: relative; display: grid; place-items: center; }
.cell .ov { position: absolute; top: -8px; right: -10px; font-size: 13px; line-height: 1; }
.shape { width: 30px; height: 30px; display: grid; place-items: center; }
.shape svg { width: 18px; height: 18px; }
.sh-in { border-radius: 50%; background: var(--in); color: var(--on-status); }
.sh-hostdef { border-radius: 50%; border: 2px solid var(--in); color: var(--in); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px color-mix(in srgb, var(--in) 0%, transparent); outline: 2px dotted var(--in); outline-offset: -7px; }
