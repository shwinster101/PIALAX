  --sk-day: #2F5274; --sk-dusk: #5B3F55; --sk-eve: #141A31; --sun: #E7C36A; --grass: #3D6A3A; --roof: #8B3A30; --wall: #CBB89D; --win: #E7C36A; --door: #5A3720;
  --sea: #23597F; --foam: #9DBBD0; --sand: #A68F69; --mtn: #4A5970; --mtn2: #5E6D86; --snow: #D7DDE7; --bldg: #2D394C; --bldg2: #3D4A60; --lit: #E7C36A;
  --frame: #3A414F; --cloud: #C7D0DC; --wire: #C8C8C8; --b1: #E7C36A; --b2: #E06A60; --b3: #4FB3A3; --b4: #9D8CEB; --table: #8E6343;

}

[hidden] { display: none !important; }
html, body { height: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.35 var(--font); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 10px; }
svg { display: block; }
.num, .tn { font-variant-numeric: tabular-nums; font-weight: 600; }
.sp { flex: 1 1 auto; }
.facebtn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border-radius: 50%; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app column ---------- */
.app { min-height: 100%; position: relative; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
.app.fabpad { padding-bottom: calc(160px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 12px; }
.screen > * { min-width: 0; }
.toprow { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); min-height: 56px; display: flex; align-items: center; gap: 4px; margin: 0 -4px; }
.ib { min-width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 12px; font-size: 21px; position: relative; flex: none; }
.ib:hover { background: var(--sunk); }
.ib .badge { position: absolute; top: -4px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pulse { animation: pulse 1.6s ease-in-out 3; } /* every pulse stops after 3 cycles */
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 18%, transparent); } }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 12px; padding: 3px; min-height: 50px; }
.seg button { border-radius: 9px; font-weight: 600; font-size: 16px; color: var(--ink2); min-height: 44px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px var(--shade); }

/* ---------- avatars (faces) with status rings ---------- */
.av { --s: 44px; position: relative; display: inline-grid; place-items: center; width: var(--s); height: var(--s); border-radius: 50%; background: var(--pc); flex: none; }
.av > .f { font-size: calc(var(--s) * .56); line-height: 1; }
.av.s28 { --s: 28px; } .av.s36 { --s: 36px; } .av.s40 { --s: 40px; } .av.s48 { --s: 48px; } .av.s64 { --s: 64px; } .av.s72 { --s: 72px; }
.st-in { box-shadow: 0 0 0 2px var(--surface), 0 0 0 5px var(--in); }
.st-hostdef { outline: 2px dotted var(--in); outline-offset: 2px; }
.st-maybe { outline: 3px dashed var(--maybe); outline-offset: 2px; }
.st-wait { outline: 2px dotted var(--mute); outline-offset: 2px; }
.st-out { background: color-mix(in srgb, var(--pc) 35%, transparent); }
.st-out > .f { opacity: .4; }
.av.s28.st-in { box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3.5px var(--in); }
.av.s28.st-maybe { outline-width: 2px; outline-offset: 1px; }
.av.s28.st-wait, .av.s28.st-hostdef { outline-offset: 1px; }
.av .mk { position: absolute; right: -5px; bottom: -5px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--on-status); box-shadow: 0 0 0 2px var(--surface); }
.av .mk svg { width: 12px; height: 12px; }
.mk.k-in { background: var(--in); } .mk.k-maybe { background: var(--maybe); } .mk.k-out { background: var(--mute); }
.mk.k-hostdef { background: var(--surface); color: var(--in); box-shadow: 0 0 0 2px var(--in); }
.av .bd { position: absolute; top: -6px; right: -7px; font-size: 13px; line-height: 1; background: var(--surface); border-radius: 9px; padding: 2px; box-shadow: 0 0 0 1px var(--line); }
.av .bd2 { top: auto; right: auto; bottom: -6px; left: -7px; }
.av .cnt { position: absolute; top: -6px; left: -8px; font-size: 12px; font-weight: 700; background: var(--surface); color: var(--ink); border-radius: 8px; padding: 0 4px; box-shadow: 0 0 0 1px var(--line); font-variant-numeric: tabular-nums; }
.av .new { position: absolute; bottom: -2px; left: -2px; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); animation: pulse 1.6s 3; }
.faces { display: flex; align-items: center; }
.faces .av + .av { margin-left: -6px; }
.more { font-size: 14px; color: var(--ink2); margin-left: 4px; font-variant-numeric: tabular-nums; font-weight: 600; }

/* ---------- trip cards ---------- */
.card { position: relative; background: var(--surface); border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; border: 1px solid var(--line); }
.card > * { min-width: 0; }
.card.dim { background: var(--sunk); } .card.dim .pc { opacity: .55; }
.card.fly { animation: fly .6s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes fly { from { transform: translateY(-40px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.card-a { display: flex; gap: 12px; align-items: flex-start; min-height: 60px; }
.card-t { flex: 1; min-width: 0; margin: 0; font-size: 17px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; padding-top: 2px; }
.card-open { text-align: left; font-weight: inherit; }
.card-open::after { content: ""; position: absolute; inset: 0; border-radius: 18px; }
.card-open:focus-visible { outline: none; }
.card-open:focus-visible::after { outline: 3px solid var(--focus); outline-offset: 2px; }
.card .z { position: relative; z-index: 1; }
.card-b, .card-c { display: flex; align-items: center; gap: 6px; min-height: 40px; }
.card-c { pointer-events: none; } /* faces, heads and the stage disc are information: a tap there opens the trip */
.card-b { flex-wrap: wrap; }
.slot { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 19px; border: 1.5px solid var(--ink); flex: none; position: relative; font-weight: 700; white-space: nowrap; }
.slot.gf { background: var(--surface); color: var(--ink); }
.slot.off { border-color: var(--mute); color: var(--mute); }
.slot.wide { width: auto; min-width: 48px; padding: 0 8px; font-size: 17px; }
.slot.plain { border-color: transparent; }
.slot .corner { position: absolute; top: -6px; right: -6px; font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 3px; min-height: 44px; padding: 0 9px; border-radius: 22px; border: 1.5px dashed var(--ink3); font-size: 14.5px; letter-spacing: -.01em; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; position: relative; }
.pill.set { border-style: solid; border-color: var(--ink); }
.pill .w { color: var(--bad); }
.pill .g, .tot .g { font-size: .82em; margin-right: 1px; }
.pill > span[data-k] { white-space: nowrap; }
.pill .dr { position: relative; display: inline-block; }
.pill .myu { position: absolute; bottom: -5px; height: 3px; border-radius: 2px; background: var(--pc); } /* my own days under the plan */
.pill .tg { position: relative; display: inline-block; } /* ⏳ days to go, the book-by arc under it */
.bba { position: absolute; left: 1px; right: 1px; bottom: -5px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.bba > i { display: block; height: 100%; border-radius: 2px; background: var(--ink2); }
.gl .bba { position: relative; display: inline-block; left: auto; right: auto; bottom: auto; width: 30px; vertical-align: middle; }
.gl .loc { display: inline-block; width: 30px; height: 20px; } .gl .loc svg { width: 100%; height: 100%; }
.tot { min-width: 44px; justify-content: flex-end; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 2px; border-radius: 12px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }
.tot.stale { color: var(--mute); }
.tot.part { color: var(--ink2); border: 1.5px solid var(--ink3); padding: 0 8px; } /* a partial total is outlined */
.tot .uf, .totalblk .uf, .sum .uf { font-size: .8em; letter-spacing: -.02em; }
.heads { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink2); }
.pips { display: inline-flex; align-items: center; gap: 4px; position: relative; padding: 0 2px; margin-left: auto; }
.pips::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 1.5px; background: var(--line); }
.pip { position: relative; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; line-height: 1; border: 1.5px solid var(--line); background: var(--surface); }
.pip > span { opacity: .45; }
.pip.past { border: 1.5px solid var(--sunk); background: var(--sunk); } .pip.past > span { opacity: 1; }
.pip.now { width: 30px; height: 30px; font-size: 15px; border: 2px solid var(--ink); background: var(--sunk); } .pip.now > span { opacity: 1; }
.pips.lg .pip { width: 26px; height: 26px; font-size: 13px; } .pips.lg .pip.now { width: 34px; height: 34px; font-size: 17px; }
.pips.one::before { display: none; }
.pips.one .pip.now { width: 28px; height: 28px; font-size: 14px; border-width: 1.5px; }
.pips.one.lg .pip.now { width: 34px; height: 34px; font-size: 18px; }
.shelfrow { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 12px; border-radius: 14px; font-size: 17px; font-weight: 600; color: var(--ink2); border: 1.5px solid var(--line); width: 100%; font-variant-numeric: tabular-nums; }
.shelfrow .chev { transition: transform .2s; margin-left: auto; width: 10px; height: 10px; margin-right: 4px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: translateY(-3px) rotate(45deg); } /* a drawn shape: ⌄ only ever closes a sheet */
.shelfrow[aria-expanded="true"] .chev { transform: translateY(3px) rotate(225deg); }

/* postcards */
.pc { position: relative; flex: none; width: 72px; height: 54px; border-radius: 6px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 3px var(--surface), 0 0 0 4px var(--line); }
.pc > svg.scene { width: 100%; height: 100%; }
.pc .loc { position: absolute; right: 2px; bottom: 2px; width: 26px; height: 17px; border-radius: 3px; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 1px; }
.pc .loc svg { width: 100%; height: 100%; }
.pc .lk { position: absolute; left: 2px; top: 2px; font-size: 11px; line-height: 1; background: var(--surface); border-radius: 4px; padding: 1px; }
.pc.lg { width: 100%; height: 120px; border-radius: 16px; box-shadow: none; }
.pc.md { width: 96px; height: 54px; }

/* ---------- FAB and tab bar ---------- */
.fab { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-size: 28px; display: grid; place-items: center; box-shadow: 0 6px 18px var(--shade); }
.tabbar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar button { min-height: 64px; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--ink2); position: relative; }
.tabbar button .g { font-size: 22px; line-height: 1; }
.tabbar button[aria-current="page"] { color: var(--ink); }
.tabbar button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.tabbar .badge { position: absolute; top: 6px; left: calc(50% + 8px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--on-ink); font-size: 12px; display: grid; place-items: center; padding: 0 4px; font-variant-numeric: tabular-nums; }

/* ---------- empty / ghost ---------- */
.ghost { border: 2px solid var(--line); border-radius: 18px; padding: 20px 16px; display: grid; justify-items: center; gap: 14px; }
.ghost svg { width: 220px; max-width: 100%; height: auto; }
.bigplus { width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-size: 28px; display: grid; place-items: center; }
.bigplus.wide { width: auto; display: inline-flex; gap: 8px; padding: 0 22px; font-size: 18px; font-weight: 700; } .bigplus.wide > span { font-size: 26px; }

/* ---------- family board ---------- */
.board { display: grid; gap: 0; align-items: center; }
.board .hd { display: grid; justify-items: center; gap: 2px; min-height: 64px; align-content: center; border-radius: 12px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.board .hd .sc { font-size: 20px; width: 34px; height: 26px; border-radius: 5px; display: grid; place-items: center; background: var(--sunk); }
.board .rowh { display: grid; justify-items: center; align-content: center; min-height: 64px; position: relative; }
.board .rowh .facebtn { position: relative; }
.board .rowh .fn { font-size: 14px; }
.board .rowh .hn { position: absolute; right: -14px; top: -4px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink2); background: var(--bg); border-radius: 8px; padding: 0 2px; line-height: 1.2; }
.board .rowh.focus .av { box-shadow: 0 0 0 3px var(--ink); }
.cell { min-height: 64px; display: grid; justify-items: center; align-content: center; gap: 4px; position: relative; border-radius: 10px; }
.cell .own { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink2); line-height: 1; }
.cell .cw { position: relative; display: grid; place-items: center; }
.cell .ov { position: absolute; top: -8px; right: -10px; font-size: 13px; line-height: 1; }
.shape { width: 30px; height: 30px; display: grid; place-items: center; }
.shape svg { width: 18px; height: 18px; }
.sh-in { border-radius: 50%; background: var(--in); color: var(--on-status); }
.sh-hostdef { border-radius: 50%; border: 2px solid var(--in); color: var(--in); box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px color-mix(in srgb, var(--in) 0%, transparent); outline: 2px dotted var(--in); outline-offset: -7px; }
.sh-maybe { width: 26px; height: 26px; transform: rotate(45deg); border: 2.5px dashed var(--maybe); color: var(--maybe); border-radius: 4px; }
.sh-maybe svg { transform: rotate(-45deg); }
.sh-out { border-radius: 5px; background: var(--sunk); color: var(--mute); border: 2px solid var(--mute); width: 26px; height: 26px; }
.sh-wait { border-radius: 50%; border: 2.5px dotted var(--mute); }
.sh-none { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.board .ft { text-align: center; font-size: 14px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; min-height: 36px; display: grid; place-items: center; }
.pager { display: flex; justify-content: space-between; }

/* ---------- trip view ---------- */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; min-height: 52px; margin: 0 -4px; }
.hero { position: relative; }
.hero .chip { position: absolute; top: 10px; left: 10px; min-height: 44px; padding: 0 10px; border-radius: 18px; background: var(--surface); font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 2px; box-shadow: 0 1px 3px var(--shade); }
.hero .chip::after { content: ""; position: absolute; inset: -4px; }
.hero .nt { position: absolute; top: 6px; right: 86px; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; font-size: 18px; }
.hero .nt span { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 1px 3px var(--shade); }
.hero .cap { position: absolute; left: 10px; bottom: 8px; right: 92px; display: grid; gap: 6px; justify-items: start; }
.ttl { margin: -2px 0 0; font-size: 20px; font-weight: 650; line-height: 1.25; text-wrap: balance; }
.sheet:focus { outline: none; }
.hero .pipbtn { min-height: 44px; display: flex; align-items: center; background: var(--surface); border-radius: 22px; padding: 0 6px; }
.hero .pipbtn .pips { margin: 0; }
.hero .ring { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 72px; height: 72px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.ring svg { width: 64px; height: 64px; }
.me { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.me .nm { font-size: 20px; font-weight: 650; min-width: 0; }
.av .wave { position: absolute; left: -8px; bottom: -8px; font-size: 20px; line-height: 1; }
.daterow { display: flex; align-items: center; gap: 8px; }
.daterow .pill { flex: 1; justify-content: center; min-width: 0; min-height: 52px; font-size: 15px; }
.daterow .pill { white-space: normal; padding: 4px 9px; }
.daterow .pill .inner { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; column-gap: 6px; row-gap: 0; min-width: 0; }
.pill .dt, .pill .inner > span { white-space: nowrap; }
.step { width: 48px; height: 48px; border-radius: 14px; border: 1.5px solid var(--ink); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; display: grid; place-items: center; }
.step:disabled { opacity: .35; cursor: not-allowed; }
.mine { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: -4px; }
.mine i { display: inline-block; width: 28px; height: 3px; border-radius: 2px; background: var(--pc); }
.answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ans { min-height: 64px; border-radius: 16px; border: 2px solid var(--line); display: grid; place-items: center; align-content: center; gap: 2px; font-weight: 700; font-size: 16px; }
.ans svg { width: 22px; height: 22px; }
.ans.in { color: var(--in); } .ans.maybe { color: var(--maybe); } .ans.out { color: var(--mute); }
.ans.in[aria-pressed="true"] { background: var(--in); border-color: var(--in); color: var(--on-status); }
.ans.maybe[aria-pressed="true"] { background: var(--maybe); border-color: var(--maybe); color: var(--on-status); }
.ans.out[aria-pressed="true"] { background: var(--mute); border-color: var(--mute); color: var(--on-status); }
.ans.def { animation: pulse 1.6s ease-in-out 1; } /* the host's default In looks unselected (it is not an answer yet), with one pulse */
.ans:disabled { opacity: .4; cursor: not-allowed; }
.answers.nudge { animation: nudge .5s 2; }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateX(-6px); } 70% { transform: translateX(6px); } }
.closed { text-align: center; font-size: 22px; }

/* people board (inside a trip) */
.pb { display: grid; gap: 4px; }
.pb-row { display: flex; align-items: center; gap: 8px; height: 72px; }
.pb-row > .facebtn { width: 48px; display: grid; place-items: center; flex: none; min-height: 48px; }
.pb-row .who { width: 76px; flex: none; display: grid; justify-items: center; align-content: start; gap: 0; height: 72px; padding-top: 7px; }
.pb-row .who .facebtn { width: 44px; height: 44px; min-height: 44px; }
.pb-row .who .fn { margin-top: 5px; font-size: 14px; height: 16px; line-height: 16px; }
.fn.you { font-size: 15px; letter-spacing: 0; overflow: visible; }
.fn { font-size: 12px; font-weight: 650; line-height: 1.15; color: var(--ink); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.01em; }
.track { position: relative; flex: 1; min-width: 0; height: 30px; }
.track .days { position: absolute; inset: 0; display: flex; }
.track .days i { flex: 1; }
.track .days i.we { background: var(--weekend); }
.track .bar { position: absolute; top: 7px; height: 16px; border-radius: 8px; background: var(--pc); }
.bar.sq-l { border-top-left-radius: 2px; border-bottom-left-radius: 2px; }
.bar.sq-r { border-top-right-radius: 2px; border-bottom-right-radius: 2px; }
.bar.maybe { background: transparent; border: 2.5px dashed var(--pc); }
.bar.wait { background: transparent; border: 2px dotted var(--mute); }
.bar.host { background: repeating-linear-gradient(135deg, var(--pc) 0 4px, transparent 4px 8px); border: 1.5px solid var(--pc); border-radius: 3px; }
.bar.off { background: repeating-linear-gradient(135deg, var(--bad) 0 3px, transparent 3px 6px); border: 1.5px solid var(--bad); }
.track .tag { position: absolute; top: 4px; font-size: 14px; line-height: 22px; }
.track .pinline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: .25; }
.pb-head { display: flex; gap: 8px; align-items: flex-end; min-height: 26px; }
.pb-head .lead { width: 76px; flex: none; }
.pb-head .nums { position: relative; flex: 1; min-width: 0; display: flex; font-size: 14px; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
.pb-head .nums span { flex: 1; text-align: center; position: relative; }
.pb-head .nums span.we { background: var(--weekend); border-radius: 4px 4px 0 0; }
.pb-head .nums span .hg { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-size: 13px; }
.pb-head .tail, .pb-row .tail { flex: none; display: flex; gap: 6px; align-items: center; }
.pr { width: 54px; text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pr.hollow { color: var(--ink3); } .pr.stale { color: var(--mute); }
.tk { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; border: 1.5px solid var(--line); }
.tk .tkg { filter: grayscale(1); opacity: .45; }
.tk.on { border-color: var(--in); background: color-mix(in srgb, var(--in) 16%, var(--surface)); }
.tk.on .tkg { filter: none; opacity: 1; }
.tk.arm { box-shadow: inset 0 0 0 2px var(--bad); }
.tk .w { color: var(--bad); font-weight: 800; }
.tkpad { width: 44px; }

/* total block */
.totrow { display: flex; gap: 8px; align-items: stretch; }
.totrow .totalblk { flex: 1; min-width: 0; }
.cheapb { min-width: 56px; border-radius: 16px; font-size: 22px; background: var(--surface); }
.totalblk { display: grid; gap: 8px; padding: 12px 14px; background: var(--surface); border-radius: 16px; border: 1px solid var(--line); text-align: left; width: 100%; }
.totalblk .big { display: flex; align-items: center; gap: 8px; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.totalblk .chipq { margin-left: auto; font-size: 15px; font-weight: 700; padding: 6px 10px; border-radius: 14px; border: 1.5px solid var(--ink); }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.stack i { display: block; background: var(--pc); }
.stack i.hollow { background: transparent; border: 1.5px solid var(--pc); border-radius: 4px; min-width: 24px; }
.stack i.stale { background: var(--mute); }
.agering { width: 18px; height: 18px; flex: none; }

/* primary split */
.split { display: flex; gap: 8px; }
.split.prim { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 25; background: var(--bg); padding: 8px 0; margin: -8px 0; box-shadow: 0 -10px 10px -10px var(--shade); }
.btn.stat { flex: none; width: auto; min-width: 64px; padding: 0 12px; border-color: var(--in); background: color-mix(in srgb, var(--in) 12%, var(--surface)); cursor: default; gap: 6px; font-size: 17px; }
.split > :first-child { flex: 1; }
.btn { min-height: 56px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 18px; font-weight: 700; padding: 0 16px; border: 2px solid var(--ink); white-space: nowrap; }
.btn.pri { background: var(--ink); color: var(--on-ink); }
.btn.sq { width: 64px; padding: 0; flex: none; font-size: 20px; }
.btn.ok { border-color: var(--in); background: color-mix(in srgb, var(--in) 14%, transparent); }
.btn:disabled, .btn.dis { opacity: .4; cursor: not-allowed; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.wide { width: 100%; }
.btn.arm { border-color: var(--bad); }
.btn.glow { animation: pulse 1.2s ease-in-out 3; }

/* ---------- map ---------- */
.chips { display: flex; gap: 6px; align-items: center; min-height: 56px; }
.toprow .chips { flex: 1; min-width: 0; }
.hscroll { overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 0 2px; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll > * { flex: none; }
.tchip { min-width: 44px; justify-content: center; min-height: 44px; padding: 0 9px; border-radius: 22px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 4px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface); }
.tchip[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tchip .e { font-size: 18px; }
.subttl { margin: -8px 0 0; font-size: 17px; font-weight: 600; }
.map { position: relative; width: 100%; aspect-ratio: 360 / 230; max-width: 100%; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .o { position: absolute; transform: translate(-50%, -50%); }
.map .o.face { width: 44px; height: 44px; display: grid; place-items: center; }
.apills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -4px; }
.apill { min-height: 44px; padding: 0 10px 0 6px; border-radius: 22px; background: var(--surface); border: 2px solid var(--pc); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.apill .pf { font-size: 18px; line-height: 1; }
.apill .ext { font-size: 13px; }
.apill.mine { box-shadow: inset 0 0 0 1.5px var(--pc); }
.apill.hollow { color: var(--ink2); background: var(--sunk); }
.apill.wait { border-color: var(--mute); border-style: dotted; }
.map .pin { display: grid; place-items: center; gap: 0; min-width: 44px; min-height: 44px; }
.map .pin .head { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--ink); display: grid; place-items: center; box-shadow: 0 2px 4px var(--shade); }
.map .pin .head > span { transform: rotate(45deg); font-size: 17px; }
.map .pin.alt .head { width: 22px; height: 22px; background: var(--surface); border: 2.5px solid var(--ink); box-shadow: none; }
.map .lbl { position: absolute; font-size: 13px; font-weight: 800; letter-spacing: .02em; background: var(--surface); padding: 0 4px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -50%); pointer-events: none; }
.map .drv { position: absolute; transform: translate(-50%, -50%); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface); border-radius: 8px; padding: 0 4px; pointer-events: none; }
.map .hosts { position: absolute; transform: translate(-50%, -50%); display: flex; }
.map .hosts .facebtn + .facebtn { margin-left: -14px; }
.map .hosts { align-items: center; }
.map .addpin { position: absolute; top: 4px; right: 4px; background: var(--surface); }
.map .tray { position: absolute; left: 4px; top: 4px; display: flex; gap: 2px; z-index: 2; }
.map .tray .facebtn { width: 44px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.map .tray .more { width: 44px; height: 44px; display: grid; place-items: center; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 50%; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.lanes { display: grid; gap: 10px; }
.lane { display: flex; gap: 8px; align-items: flex-start; }
.lane .lh { min-width: 66px; flex: none; display: flex; align-items: center; gap: 6px; min-height: 44px; }
.lane .lc { font-size: 15px; font-weight: 800; letter-spacing: .02em; }
.lane .cl { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.pk { min-height: 44px; padding: 0 10px; border-radius: 12px; border: 1.5px solid var(--ink2); background: var(--surface); display: inline-flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pk.arr { background: var(--sunk); border-color: var(--ink); }
.pk.dep { background: transparent; }
.pk .dir { font-weight: 800; }
.pk .t.pred { color: var(--mute); }
.pk.maybe { border-style: dashed; border-color: var(--maybe); }
.grp { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 4px 4px 4px 46px; border: 1.5px solid var(--ink2); border-radius: 14px; position: relative; }
.grp > .gh { position: absolute; left: 4px; top: 50%; transform: translateY(-50%); display: grid; justify-items: center; gap: 2px; width: 40px; }
.grp > .gh > span[data-k="pickup"] { font-size: 17px; line-height: 1; } .grp > .gh > .tn { font-size: 13px; }
.minipin { width: 22px; height: 22px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--ink); display: grid; place-items: center; }
.minipin > span { transform: rotate(45deg); font-size: 11px; }
.minipin.alt { background: var(--surface); border: 2.5px solid var(--ink); width: 18px; height: 18px; }

/* ---------- calendar ---------- */
.people { display: flex; flex-wrap: wrap; gap: 6px; }
.people .facebtn { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; }
.people .facebtn[aria-pressed="true"] .av { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
.monthhd { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.monthhd h3 { flex: 1; text-align: center; }
.monthhd h3 { margin: 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.grid .wd { min-height: 20px; font-size: 12px; font-weight: 700; color: var(--ink2); text-align: center; line-height: 20px; border-bottom: 1px solid var(--line); }
.grid .wd.we { background: var(--weekend); }
.dc { position: relative; min-height: 62px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 3px; text-align: left; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; min-width: 0; overflow: hidden; }
.dc:nth-child(7n) { border-right: 0; }
.dc.we { background: var(--weekend); }
.dc.blank { background: transparent; }
.dc.past, .dc.outw { background-image: repeating-linear-gradient(135deg, var(--hatch) 0 3px, transparent 3px 7px); }
.dc .dn { position: relative; z-index: 4; font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1; background: var(--surface); border-radius: 4px; padding: 1px 2px; margin: -1px -2px; }
.dc.we .dn { font-weight: 800; }
.dc.past .dn, .dc.blank .dn { background: transparent; }
.dc.today .dn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 2px var(--ink); color: var(--ink); margin: -3px 0 0 -3px; }
.dc .hg { position: absolute; top: 2px; right: 2px; font-size: 12px; line-height: 1; }
.dc .caps { position: absolute; left: 0; right: 0; top: 24px; }
.dc .cp { position: absolute; left: -1px; right: -1px; height: 6px; background: var(--ink); }
.dc .cp.prop { background: repeating-linear-gradient(90deg, var(--ink) 0 6px, transparent 6px 10px); }
.dc .cp.st { left: 4px; border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.dc .cp.en { right: 4px; border-top-right-radius: 4px; border-bottom-right-radius: 4px; }

.dc .cp.wn { background: repeating-linear-gradient(90deg, var(--ink2) 0 2px, transparent 2px 5px); height: 4px; }
.dc .cp.dim { opacity: .25; }
.dc .se { position: absolute; left: 3px; font-size: 12px; line-height: 1; }
.dc .warn { position: absolute; right: 3px; top: 3px; z-index: 5; font-size: 13px; color: var(--bad); line-height: 1; background: var(--surface); border-radius: 4px; } .dc .warn.wh { right: 17px; } /* a corner of its own, clear of the trip lines */
.dc .glow { position: absolute; inset: 0; background: color-mix(in srgb, var(--pc) 24%, transparent); box-shadow: inset 0 -3px 0 var(--pc); }
.dc.dimday > .caps, .dc.dimday > .hg { opacity: .4; } .dc.dimday .dn { color: var(--ink2); } /* the numeral keeps its contrast; the trip lines fade */
.dc .heat { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) var(--h), transparent); }
.dc .pc-n { position: absolute; right: 9px; bottom: 3px; z-index: 3; color: var(--ink); background: var(--surface); border-radius: 4px; padding: 1px 2px; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.dc .dots { position: absolute; left: 4px; right: 4px; top: 24px; display: flex; flex-wrap: wrap; gap: 2px; }
.dc .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); }
.dc .dots i.hollow { background: transparent; box-shadow: inset 0 0 0 1.5px var(--pc); }
.dc .dots i.maybe { background: transparent; border: 1.5px dashed var(--maybe); }
.dc .plan { position: absolute; inset: 2px -1px; border-top: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); pointer-events: none; }
.dc .plan.prop { border-top-style: dashed; border-bottom-style: dashed; }
.dc .plan.st { left: 1px; border-left: 2.5px solid var(--ink); border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
.dc .plan.en { right: 1px; border-right: 2.5px solid var(--ink); border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
.dc .plan.prop.st { border-left-style: dashed; } .dc .plan.prop.en { border-right-style: dashed; }
.dc .plan.grey { border-color: var(--ink3); } /* the plan behind someone's own pick */
.dc .best { position: absolute; inset: 4px 0; border-top: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); pointer-events: none; }
.dc .best.st { left: 4px; border-left: 2px solid var(--ink3); } .dc .best.en { right: 4px; border-right: 2px solid var(--ink3); }
.dc .myline { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--pc); }
.brkx { position: absolute; top: 3px; bottom: 3px; width: 5px; border: 2px solid var(--ink2); pointer-events: none; }
.brkx.l { left: 1px; border-right: 0; border-radius: 3px 0 0 3px; } .brkx.r { right: 1px; border-left: 0; border-radius: 0 3px 3px 0; }
.dc .pinday { position: absolute; left: 3px; bottom: 2px; font-size: 20px; line-height: 1; }
.dc .sel { position: absolute; inset: 2px 0; background: color-mix(in srgb, var(--ink) 16%, transparent); }
.dc .sel.st { left: 3px; border-top-left-radius: 10px; border-bottom-left-radius: 10px; box-shadow: inset 3px 0 0 var(--ink); }
.dc .sel.en { right: 3px; border-top-right-radius: 10px; border-bottom-right-radius: 10px; box-shadow: inset -3px 0 0 var(--ink); }
.dc .sel.st.en { box-shadow: inset 3px 0 0 var(--ink), inset -3px 0 0 var(--ink); }
.dc .sel.who { background: color-mix(in srgb, var(--pc) 26%, transparent); }
.dc .sel.who.st { box-shadow: inset 3px 0 0 var(--pc); } .dc .sel.who.en { box-shadow: inset -3px 0 0 var(--pc); } .dc .sel.who.st.en { box-shadow: inset 3px 0 0 var(--pc), inset -3px 0 0 var(--pc); }
.dc:disabled { cursor: default; }
.dc.nope { opacity: .45; }
.calfab { position: fixed; z-index: 30; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: var(--on-ink); font-size: 24px; display: grid; place-items: center; box-shadow: 0 6px 18px var(--shade); }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 70; background: var(--scrim); }
.sheet { position: fixed; z-index: 71; left: 0; right: 0; bottom: 0; max-height: min(calc(100% - 0px - 12px), 88vh); overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px var(--shade);
  padding-block: 8px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet > * { flex-shrink: 0; }
.sheet.open { animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } to { transform: none; opacity: 1; } }
