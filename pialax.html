<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="pialax-version" content="2.0.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>PIALAX</title>
<style>
:root { color-scheme: light dark; font-family: system-ui, sans-serif; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; }
main { padding: 24px; } a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; }
</style>
</head>
<body>
<main><h1>PIALAX</h1><a id="open" href="app.html">Open</a><noscript><p>Enable JavaScript.</p></noscript></main>
<script>
(function () {
  'use strict';
  // Fixed sibling destination. Preserve encoded query/hash bytes; app.html consumes credentials.
  var target = 'app.html' + window.location.search + window.location.hash;
  document.getElementById('open').setAttribute('href', target);
  try { window.location.replace(target); } catch (e) { /* Manual link remains available. */ }
})();
</script>
</body>
</html>
